[package]
name = "moph-provider-client"
version = "0.1.6"
rust-version = "1.93"
edition = "2024"
authors = ["Marisada Pitakthum <p.marisada@gmail.com>"]
description = "Rust client for authentication via MOPH Provider ID"
license = "MIT"
repository = "https://github.com/Marisada/moph-provider-client"
keywords = []

[dependencies]
base64 = "0.23"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", features = [ "json", "form" ] }
serde = "1"
serde_derive = "1"
serde_json = "1"
tokio = { version = "1", features = [ "sync" ]}
